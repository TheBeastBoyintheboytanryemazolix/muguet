name: Build IPA from main (private game file)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA from unchanged main and store privately in Google Drive
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout main source only
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Get a private Google Drive access token
        id: gdrive-auth
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GDRIVE_CLIENT_ID"
          test -n "$GDRIVE_CLIENT_SECRET"
          test -n "$GDRIVE_REFRESH_TOKEN"
          RESPONSE="$(curl --fail --silent --show-error --location \
            -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "client_id=$GDRIVE_CLIENT_ID" \
            --data-urlencode "client_secret=$GDRIVE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GDRIVE_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.access_token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Download private game.wasm
        env:
          ACCESS_TOKEN: ${{ steps.gdrive-auth.outputs.access_token }}
          GAME_WASM_DRIVE_FILE_ID: ${{ secrets.GAME_WASM_DRIVE_FILE_ID }}
        run: |
          set -euo pipefail
          test -n "$ACCESS_TOKEN"
          test -n "$GAME_WASM_DRIVE_FILE_ID"
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/$GAME_WASM_DRIVE_FILE_ID?alt=media" \
            -o "$RUNNER_TEMP/game.wasm"
          SIZE="$(stat -f%z "$RUNNER_TEMP/game.wasm")"
          echo "Downloaded game.wasm ($SIZE bytes)"
          test "$SIZE" -gt 50000000
          test "$SIZE" -lt 100000000

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust toolchain and iOS target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios

      - name: Build IPA with private game code
        working-directory: source
        env:
          FREE: "1"
          BUNDLE_ID: "ch.cclerc.muguet.ios"
        run: ./make-ios.sh "$RUNNER_TEMP/game.wasm" --ipa

      - name: Upload IPA to private Google Drive folder
        env:
          ACCESS_TOKEN: ${{ steps.gdrive-auth.outputs.access_token }}
          IPA_DRIVE_FOLDER_ID: ${{ secrets.IPA_DRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$ACCESS_TOKEN"
          test -n "$IPA_DRIVE_FOLDER_ID"
          RESPONSE="$(curl --fail --silent --show-error --location \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -F "metadata={\"name\":\"Muguet-IPA-from-main-${GITHUB_RUN_NUMBER}.ipa\",\"parents\":[\"$IPA_DRIVE_FOLDER_ID\"]};type=application/json" \
            -F "file=@source/build/Muguet.ipa;type=application/octet-stream" \
            "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink")"
          echo "IPA uploaded to Google Drive. Keep the destination folder private."
          echo "$RESPONSE"
