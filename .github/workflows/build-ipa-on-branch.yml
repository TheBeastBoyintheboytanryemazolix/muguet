name: Build Muguet IPA (branch trigger)

on:
  push:
    branches:
      - github-actions-build-ipa
  workflow_dispatch:
    inputs:
      game_zip_url:
        description: "Direct HTTPS URL to the game ZIP (not a GoFile folder page)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: muguet-ipa-branch-build
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned iOS IPA with game code
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Install required Rust toolchain and iOS target
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1
          rustup toolchain list

      - name: Download and validate game ZIP
        env:
          GAME_ZIP_URL: ${{ inputs.game_zip_url || secrets.MUGUET_GAME_ZIP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GAME_ZIP_URL:-}" ]]; then
            echo "::error::Provide a direct HTTPS ZIP URL using Run workflow > Game ZIP URL, or add secret MUGUET_GAME_ZIP_URL."
            exit 1
          fi
          case "$GAME_ZIP_URL" in
            https://*) ;;
            *) echo "::error::Game ZIP URL must use HTTPS."; exit 1 ;;
          esac
          export GAME_ZIP_URL
          python3 <<'PY'
          import os, re, sys, urllib.request, zipfile
          source = os.environ["GAME_ZIP_URL"].strip()
          output = os.path.join(os.environ["RUNNER_TEMP"], "muguet-game.zip")
          req = urllib.request.Request(source, headers={"User-Agent": "Muguet-iOS-IPA-GitHub-Actions"})
          try:
              with urllib.request.urlopen(req, timeout=240) as response:
                  data = response.read()
                  final_url = response.geturl()
          except Exception as exc:
              sys.exit("Could not download the game ZIP: %s" % (str(exc)[:240],))
          if not data.startswith(b"PK"):
              sys.exit("The URL did not return ZIP bytes (it may be a GoFile folder webpage). Use a direct ZIP download URL, not https://gofile.io/d/CODE.")
          with open(output, "wb") as f:
              f.write(data)
          try:
              with zipfile.ZipFile(output) as zf:
                  bad = zf.testzip()
                  names = zf.namelist()
                  if bad:
                      sys.exit("ZIP integrity check failed at " + bad)
          except Exception as exc:
              sys.exit("Downloaded content is not a valid ZIP: " + str(exc)[:200])
          if not any(re.search(r"(^|/)b/[^/]+/game\\.wasm$", name) for name in names):
              sys.exit("ZIP lacks required b/<build>/game.wasm layout.")
          print("Downloaded and validated game ZIP (%d bytes)." % len(data))
          PY

      - name: Build IPA
        env:
          BUNDLE_ID: ch.cclerc.muguet.ios
        run: |
          set -euo pipefail
          ./make-ios.sh "$RUNNER_TEMP/muguet-game.zip" --ipa
          rm -f "$RUNNER_TEMP/muguet-game.zip"

      - name: Verify IPA
        run: |
          set -euo pipefail
          test -s build/Muguet.ipa
          unzip -tq build/Muguet.ipa
          unzip -Z1 build/Muguet.ipa | grep -q '^Payload/Muguet.app/'
          echo "IPA built successfully. This is an ad-hoc/unsigned sideload build, not App Store signed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: muguet-ios-ipa
          path: build/Muguet.ipa
          if-no-files-found: error
          retention-days: 7
